<!-- Carte de contrôle avsync. Montée par le shell Sources (I/O). -->
<div class="avs">

  <!-- ─── État live ────────────────────────────────────────────────────── -->
  <div class="avs-live" aria-live="polite">
    <div class="avs-fps-row">
      <span class="avs-fps-val">—</span>
      <span class="avs-fps-unit">fps</span>
      <span class="avs-live-fmt">—</span>
    </div>
    <div class="avs-params-row">
      <span class="avs-param-chip">beat <span data-live="beat_sec">—</span> s</span>
      <span class="avs-param-chip">flash <span data-live="flash_ms">—</span> ms</span>
      <span class="avs-param-chip">bip <span data-live="tone_hz">—</span> Hz</span>
      <span class="avs-param-chip" data-live-brand>marque —</span>
    </div>
  </div>

  <!-- ─── Format ─── redéploiement ──────────────────────────────────────── -->
  <div class="avs-sec">
    <div class="avs-sec-hd">
      <span class="avs-sec-lbl">Format</span>
      <span class="avs-sec-note">(redéploiement)</span>
      <span class="avs-fb" data-group="fmt"></span>
      <button class="btn btn-sm btn-blue avs-apply" data-group="fmt">Appliquer</button>
    </div>
    <div class="avs-row">
      <label class="avs-f avs-f-preset">
        <span>Résolution</span>
        <select name="fmt_preset">
          <option value="">Chargement…</option>
        </select>
      </label>
      <label class="avs-f avs-f-sel">
        <span>Chroma</span>
        <select name="chroma">
          <option value="420">4:2:0</option>
          <option value="422">4:2:2</option>
          <option value="444">4:4:4</option>
        </select>
      </label>
    </div>
  </div>

  <!-- ─── Timing A/V ─── à chaud ────────────────────────────────────────── -->
  <div class="avs-sec">
    <div class="avs-sec-hd">
      <span class="avs-sec-lbl">Timing A/V</span>
      <span class="avs-fb" data-group="av"></span>
      <button class="btn btn-sm btn-blue avs-apply" data-group="av">Appliquer</button>
    </div>
    <div class="avs-knobs">
      <div class="avs-knob-wrap">
        <div class="avs-knob" role="slider" tabindex="0"
             data-name="beat_sec" data-val="1.0"
             data-min="0.2" data-max="10" data-step="0.1"
             aria-label="Battement" aria-valuemin="0.2" aria-valuemax="10" aria-valuenow="1.0">
          <span class="avs-knob-dial"></span>
        </div>
        <span class="avs-knob-val">1.0<span class="avs-knob-unit"> s</span></span>
        <span class="avs-knob-lbl">Battement</span>
      </div>
      <div class="avs-knob-wrap">
        <div class="avs-knob" role="slider" tabindex="0"
             data-name="flash_ms" data-val="40"
             data-min="10" data-max="500" data-step="5"
             aria-label="Flash + bip" aria-valuemin="10" aria-valuemax="500" aria-valuenow="40">
          <span class="avs-knob-dial"></span>
        </div>
        <span class="avs-knob-val">40<span class="avs-knob-unit"> ms</span></span>
        <span class="avs-knob-lbl">Flash + bip</span>
      </div>
      <div class="avs-knob-wrap">
        <div class="avs-knob" role="slider" tabindex="0"
             data-name="tone_hz" data-val="1000"
             data-min="100" data-max="12000" data-step="50"
             aria-label="Tonalité" aria-valuemin="100" aria-valuemax="12000" aria-valuenow="1000">
          <span class="avs-knob-dial"></span>
        </div>
        <span class="avs-knob-val">1000<span class="avs-knob-unit"> Hz</span></span>
        <span class="avs-knob-lbl">Tonalité</span>
      </div>
    </div>
  </div>

  <!-- ─── Affichage ─── à chaud ─────────────────────────────────────────── -->
  <div class="avs-sec">
    <div class="avs-sec-hd">
      <span class="avs-sec-lbl">Affichage</span>
      <span class="avs-fb" data-group="disp"></span>
      <button class="btn btn-sm btn-blue avs-apply" data-group="disp">Appliquer</button>
    </div>
    <div class="avs-row avs-row-col">
      <label class="palette-field-check avs-switch">
        <input type="checkbox" name="show_brand">
        <span>Afficher la marque (logo + nom + lieu)</span>
      </label>
      <label class="palette-field-check avs-switch"
             title="Incruste le timecode heure du jour (hh:mm:ss:img) sous le compteur ET émet un flux ANC ATC RP 188 (RFC 8331) câblable — ex. vers le port ANC d'une fenêtre de multiview.">
        <input type="checkbox" name="tc_enable">
        <span>Générateur de timecode (incrusté + flux ANC)</span>
      </label>
      <label class="avs-f avs-f-full">
        <span>Texte</span>
        <input type="text" name="custom_text" placeholder="ex. Banc d'essai — Régie A">
      </label>
    </div>
  </div>

</div>
